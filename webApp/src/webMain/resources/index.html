<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro REPL</title>

    <meta name="description"
          content="A MicroPython IDE in the browser: REPL terminal, code editor and file explorer for MicroPython boards over USB.">
    <meta name="keywords" content="MicroPython, CircuitPython, REPL, IDE, Web Serial, ESP32, Raspberry Pi Pico">
    <meta name="author" content="Mahmoud Aly">
    <meta name="theme-color" content="#14161A">
    <meta name="color-scheme" content="dark light">

    <!-- link previews -->
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary">

    <!-- icons -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">

    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#3A3F47" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#8AB4F8" stroke-width="4" fill="none" stroke-linecap="round"

            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
