<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro REPL</title>

    <meta name="description"
          content="A MicroPython IDE in the browser: REPL terminal, code editor and file explorer for MicroPython boards over USB.">
    <meta name="keywords" content="MicroPython, CircuitPython, REPL, IDE, Web Serial, ESP32, Raspberry Pi Pico">
    <meta name="author" content="Mahmoud Aly">
    <meta name="theme-color" content="#14161A">
    <meta name="color-scheme" content="dark light">

    <!-- link previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Micro REPL">
    <meta property="og:description"
          content="A MicroPython IDE in the browser: REPL terminal, code editor and file explorer.">
    <meta property="og:image" content="icon-512.png">
    <meta name="twitter:card" content="summary">

    <!-- icons -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">

    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="loader">
        <img src="icon-192.png" width="72" height="72" alt="">
        <div>&gt;&gt;&gt; Micro REPL</div>
        <div class="bar"></div>
    </div>
    <script>
        // the dev server on localhost always serves fresh files
        if ("serviceWorker" in navigator && location.hostname !== "localhost") {
            navigator.serviceWorker.register("sw.js");
        }
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
