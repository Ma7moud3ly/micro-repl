name: build

on:
  pull_request:
    branches: [master]
  # Tags produce a release build and publish it.
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: defaultDebug
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build defaultDebug
        run: ./gradlew assembleDefaultDebug

      - uses: actions/upload-artifact@v4
        with:
          name: default-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error

  release:
    name: defaultRelease
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set - refusing to publish an unsigned release"
            exit 1
          fi
          mkdir -p keys
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keys/release.keystore

      - name: Build defaultRelease
        env:
          RELEASE_STORE_FILE: keys/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDefaultRelease

      - name: Remove keystore
        if: always()
        run: rm -rf keys

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apks=$(find app/build/outputs/apk/default/release -name '*.apk')
          if [ -z "$apks" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "$apks"
          gh release create "${GITHUB_REF_NAME}" $apks \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
