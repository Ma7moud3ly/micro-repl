name: build

on:
  # Pull requests get a quick debug build of every platform.
  pull_request:
    branches: [master]
  # Tags produce release builds and publish them.
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- pull request: debug builds ---------------------------------------------------

  check:
    name: debug (Android, Linux desktop, web)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build
        run: >
          ./gradlew
          :androidApp:assembleDefaultDebug
          :desktopApp:packageDeb
          :webApp:wasmJsBrowserDevelopmentExecutableDistribution

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: androidApp/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: linux-debug
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: web-debug
          path: webApp/build/dist/wasmJs/developmentExecutable/
          if-no-files-found: error

  # --- tag: release builds ----------------------------------------------------------

  android:
    name: release (Android)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set - refusing to publish an unsigned release"
            exit 1
          fi
          mkdir -p keys
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keys/release.keystore

      - name: Build defaultRelease
        env:
          RELEASE_STORE_FILE: keys/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleDefaultRelease

      - name: Remove keystore
        if: always()
        run: rm -rf keys

      - name: Name the APK
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk/default/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          mkdir -p out
          cp "$apk" "out/micro-repl-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: out/*
          if-no-files-found: error

  desktop:
    name: release (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            task: packageReleaseDeb
            format: deb
            suffix: linux-amd64
          - name: macOS
            os: macos-latest
            task: packageReleaseDmg
            format: dmg
            suffix: macos
          - name: Windows
            os: windows-latest
            task: packageReleaseMsi
            format: msi
            suffix: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build ${{ matrix.task }}
        run: ./gradlew :desktopApp:${{ matrix.task }}

      - name: Name the package
        run: |
          set -euo pipefail
          file=$(find desktopApp/build/compose/binaries/main-release/${{ matrix.format }} \
            -name '*.${{ matrix.format }}' | head -1)
          if [ -z "$file" ]; then
            echo "::error::No .${{ matrix.format }} produced"
            exit 1
          fi
          mkdir -p out
          cp "$file" "out/micro-repl-${GITHUB_REF_NAME}-${{ matrix.suffix }}.${{ matrix.format }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error

  web:
    name: release (web)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build the production web app
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Zip it
        run: |
          set -euo pipefail
          mkdir -p out
          cd webApp/build/dist/wasmJs/productionExecutable
          zip -r "$GITHUB_WORKSPACE/out/micro-repl-${GITHUB_REF_NAME}-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: out/*
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: [android, desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la out
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
